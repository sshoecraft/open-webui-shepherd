version: '3.8'

services:
  open-webui-shepherd:
    build:
      context: .
      dockerfile: Dockerfile.simple
    container_name: open-webui-shepherd
    ports:
      - "5555:5555"
    volumes:
      # Mount existing data directory for persistence
      - /home/acmadmin/.open-webui:/app/backend/data
    environment:
      - DATA_DIR=/app/backend/data
      - WEBUI_SECRET_KEY=
      - OPENAI_API_BASE_URL=http://host.docker.internal:5554/v1
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
